<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kas Rumah</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#17302b">
<style>
:root{--bg:#f2f5f3;--ink:#17302b;--mut:#6b7f79;--card:#fff;--in:#1e8e5a;--out:#d2453d;--line:#dde5e1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c19;--ink:#e6efec;--mut:#8aa19a;--card:#17302b;--in:#4cc88c;--out:#ff7a70;--line:#27443d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto;padding:14px}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%}
.ghost{background:none;border:0;color:var(--mut);padding:6px}
.saldo{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;margin-bottom:12px}
.saldo b{font-size:28px;display:block}.row{display:flex;gap:16px;margin-top:8px;font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}.saldo .in{color:#7be0ae}.saldo .out{color:#ffa49c}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item small{color:var(--mut);display:block}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;background:var(--in);border-radius:3px}.over i{background:var(--out)}.bud{display:flex;align-items:center;gap:8px;margin-bottom:8px}.bud input{margin:0;width:130px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:8px;font-weight:600}
.seg .on{background:var(--card)}.seg .on.k{color:var(--out)}.seg .on.m{color:var(--in)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border-radius:20px;padding:6px 6px 6px 12px;margin:0 6px 6px 0}
.chip button{border:0;background:var(--line);border-radius:50%;width:22px;height:22px;line-height:1}
.add{display:flex;gap:8px}.add input{margin:0}.add button{width:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px;color:var(--mut);font-weight:600}nav .on{color:var(--ink)}
.hide{display:none}#msg{text-align:center;color:var(--mut);font-size:13px;min-height:18px}
</style></head><body><main>
<header><h1>Kas Rumah</h1><button class="ghost" id="reset">Pengaturan</button></header>
<div id="msg"></div>

<section id="v-setup" class="hide card">
<b>Hubungkan ke Google Sheet</b><p style="color:var(--mut);font-size:14px">Tempel URL Web App dari Apps Script dan PIN-nya.</p>
<input id="nama" placeholder="Nama kamu (mis. Ibu)"><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><input id="pin" type="password" placeholder="PIN">
<button class="btn" id="saveCfg">Simpan</button></section>

<section id="v-home" class="hide">
<input type="month" id="bulan">
<div class="saldo">Saldo bulan ini<b id="saldo"></b><div class="row"><span class="in" id="tin"></span><span class="out" id="tout"></span></div></div>
<div class="card" id="rekap"></div>
<div class="card" id="riwayat"></div></section>

<section id="v-add" class="hide">
<div class="seg" id="seg"><button data-t="keluar" class="on k">Pengeluaran</button><button data-t="masuk">Pemasukan</button></div>
<input id="jml" inputmode="numeric" placeholder="Jumlah (Rp)"><select id="kat"></select>
<input type="date" id="tgl"><input id="cat" placeholder="Catatan (opsional)">
<button class="btn" id="simpan">Simpan transaksi</button><button class="ghost hide" id="batal" style="width:100%">Batal edit</button></section>

<section id="v-kat" class="hide">
<div class="card"><b>Kategori pengeluaran</b><div id="kk" style="margin:10px 0"></div><div class="add"><input id="nk" placeholder="Kategori baru"><button class="btn" data-add="keluar">Tambah</button></div></div>
<div class="card"><b>Kategori pemasukan</b><div id="km" style="margin:10px 0"></div><div class="add"><input id="nm" placeholder="Kategori baru"><button class="btn" data-add="masuk">Tambah</button></div></div>
<div class="card"><b>Anggaran bulanan</b><p style="color:var(--mut);font-size:14px;margin:4px 0 10px">Batas per kategori pengeluaran. Kosongkan jika tanpa batas.</p><div id="bud"></div></div></section>
</main>
<nav><button data-v="home" class="on">Beranda</button><button data-v="add">Catat</button><button data-v="kat">Kategori</button></nav>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let cfg=JSON.parse(localStorage.cfg||'{}'),D=JSON.parse(localStorage.data||'{"trx":[],"kat":[],"bud":{}}'),tipe='keluar',view='home',editId=null;
const msg=t=>$('#msg').textContent=t||'';
const setSeg=()=>document.querySelectorAll('#seg button').forEach(x=>x.className=x.dataset.t===tipe?'on '+(tipe==='keluar'?'k':'m'):'');
function resetForm(){editId=null;$('#jml').value=$('#cat').value='';$('#tgl').value=today();$('#simpan').textContent='Simpan transaksi';$('#batal').classList.add('hide')}
function startEdit(id){const t=D.trx.find(x=>x.id===id);if(!t)return;editId=id;tipe=t.tipe;setSeg();show('add');
  $('#jml').value=t.jumlah;$('#tgl').value=t.tanggal;$('#cat').value=t.catatan||'';$('#kat').value=t.kategori;
  $('#simpan').textContent='Simpan perubahan';$('#batal').classList.remove('hide')}
async function post(b){const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({pin:cfg.pin,...b})});const j=await r.json();if(!j.ok)throw Error(j.error)}
async function load(){
  if(!cfg.url)return;msg('Memuat…');
  try{const r=await fetch(cfg.url+'?pin='+encodeURIComponent(cfg.pin));const j=await r.json();
    if(!j.ok)throw Error(j.error);D=j;localStorage.data=JSON.stringify(D);msg('')}
  catch(e){msg('Offline / gagal memuat: '+e.message)}
  render()}
function show(v){view=v;['home','add','kat','setup'].forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function render(){
  if(!cfg.url){show('setup');return}
  const bl=$('#bulan').value,T=D.trx.filter(t=>t.tanggal.startsWith(bl)).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  const sum=x=>T.filter(t=>t.tipe===x).reduce((s,t)=>s+t.jumlah,0),i=sum('masuk'),o=sum('keluar');
  $('#saldo').textContent=rp(i-o);$('#tin').textContent='↑ '+rp(i);$('#tout').textContent='↓ '+rp(o);
  const per={};T.filter(t=>t.tipe==='keluar').forEach(t=>per[t.kategori]=(per[t.kategori]||0)+t.jumlah);
  const bud=D.bud||{},po={};T.filter(t=>t.tipe==='keluar').forEach(t=>{const n=t.pencatat||'-';po[n]=(po[n]||0)+t.jumlah});
  const cats=[...new Set([...Object.keys(per),...Object.keys(bud)])].sort((a,b)=>(per[b]||0)-(per[a]||0));
  $('#rekap').innerHTML='<b>Pengeluaran per kategori</b>'+(cats.length?cats.map(k=>{const v=per[k]||0,m=bud[k]||0,p=m?v/m*100:(o?v/o*100:0);return `<div style="margin-top:10px"><div class="item" style="border:0;padding:0"><span>${esc(k)}${m&&v>m?' ⚠':''}</span><span>${rp(v)}${m?' / '+rp(m):''}</span></div><div class="bar ${m&&v>m?'over':''}"><i style="width:${Math.min(p,100)}%"></i></div></div>`}).join(''):'<p style="color:var(--mut)">Belum ada pengeluaran.</p>')+(Object.keys(po).length>1?'<div style="margin-top:12px;color:var(--mut);font-size:14px">Dicatat oleh: '+Object.entries(po).map(([n,v])=>esc(n)+' '+rp(v)).join(' · ')+'</div>':'');
  $('#riwayat').innerHTML='<b>Riwayat</b>'+(T.length?T.map(t=>`<div class="item"><div>${esc(t.kategori)}<small>${t.tanggal}${t.pencatat?' · '+esc(t.pencatat):''}${t.catatan?' · '+esc(t.catatan):''}</small></div><div><span class="${t.tipe==='masuk'?'in':'out'}">${t.tipe==='masuk'?'+':'−'}${rp(t.jumlah)}</span> <button class="ghost" data-edit="${t.id}">✎</button><button class="ghost" data-del="${t.id}">✕</button></div></div>`).join(''):'<p style="color:var(--mut)">Belum ada transaksi bulan ini.</p>');
  const cur=$('#kat').value;$('#kat').innerHTML=D.kat.filter(k=>k.tipe===tipe).map(k=>`<option>${esc(k.nama)}</option>`).join('');
  if([...$('#kat').options].some(o=>o.value===cur))$('#kat').value=cur;
  $('#bud').innerHTML=D.kat.filter(k=>k.tipe==='keluar').map(k=>`<div class="bud"><span style="flex:1">${esc(k.nama)}</span><input inputmode="numeric" placeholder="Tanpa batas" value="${bud[k.nama]||''}" data-bud="${esc(k.nama)}"></div>`).join('');
  [['keluar','#kk'],['masuk','#km']].forEach(([t,s])=>$(s).innerHTML=D.kat.filter(k=>k.tipe===t).map(k=>`<span class="chip">${esc(k.nama)}<button data-dk="${t}|${esc(k.nama)}">×</button></span>`).join('')||'<span style="color:var(--mut)">Kosong</span>')}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v)return show(b.dataset.v);
  if(b.dataset.t){tipe=b.dataset.t;setSeg();return render()}
  if(b.dataset.edit)return startEdit(b.dataset.edit);
  try{
    if(b.dataset.del){if(!confirm('Hapus transaksi ini?'))return;D.trx=D.trx.filter(t=>t.id!==b.dataset.del);render();await post({action:'del',id:b.dataset.del})}
    else if(b.dataset.add){const inp=$(b.dataset.add==='keluar'?'#nk':'#nm'),nama=inp.value.trim();if(!nama)return;
      D.kat.push({tipe:b.dataset.add,nama});inp.value='';render();await post({action:'addKat',tipe:b.dataset.add,nama})}
    else if(b.dataset.dk){const[t,n]=b.dataset.dk.split('|');D.kat=D.kat.filter(k=>!(k.tipe===t&&k.nama===n));render();await post({action:'delKat',tipe:t,nama:n})}
    else return;load()}catch(err){msg('Gagal: '+err.message);load()}});
$('#simpan').onclick=async()=>{
  const jumlah=Number($('#jml').value.replace(/\D/g,'')),kategori=$('#kat').value;
  if(!jumlah||!kategori)return msg('Isi jumlah dan kategori dulu.');
  const old=editId&&D.trx.find(x=>x.id===editId),t={id:editId||'tmp'+Date.now(),tanggal:$('#tgl').value||today(),tipe,kategori,jumlah,catatan:$('#cat').value.trim(),pencatat:old?old.pencatat:cfg.nama||''};
  const act=editId?'edit':'add';if(old)Object.assign(old,t);else D.trx.push(t);resetForm();$('#bulan').value=t.tanggal.slice(0,7);show('home');
  try{await post({action:act,...t});msg('Tersimpan ✓')}catch(e){msg('Gagal simpan: '+e.message)}load()};
$('#saveCfg').onclick=()=>{cfg={url:$('#url').value.trim(),pin:$('#pin').value,nama:$('#nama').value.trim()};localStorage.cfg=JSON.stringify(cfg);show('home');load()};
$('#reset').onclick=()=>{$('#url').value=cfg.url||'';$('#pin').value=cfg.pin||'';$('#nama').value=cfg.nama||'';show('setup')};
$('#batal').onclick=()=>{resetForm();show('home')};
document.addEventListener('change',async e=>{const k=e.target.dataset.bud;if(!k)return;const batas=Number(e.target.value.replace(/\D/g,''))||0;D.bud=D.bud||{};if(batas)D.bud[k]=batas;else delete D.bud[k];
  try{await post({action:'setBud',kategori:k,batas});msg('Anggaran tersimpan ✓')}catch(err){msg('Gagal: '+err.message)}render()});
$('#bulan').onchange=render;$('#bulan').value=today().slice(0,7);$('#tgl').value=today();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
show('home');load();
</script></body></html>
